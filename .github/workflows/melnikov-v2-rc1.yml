name: MELNIKOV V2 RC1 Windows CI
on:
  push:
    branches: [ci-v2-rc1-20261108]
jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Expand RC1 source
        shell: powershell
        run: |
          Expand-Archive -LiteralPath ci/melnikov_v2_rc1_ci_source.zip -DestinationPath work -Force
          Get-ChildItem work
      - name: Install Rust 1.99.1
        shell: powershell
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.99.1-x86_64-pc-windows-msvc
          rustc -V
          cargo -V
      - name: Restore GStreamer 1.28.8 SDK cache
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: C:\gstreamer\1.0\msvc_x86_64
          key: gstreamer-1.28.8-devel-msvc-x86_64-v1

      - name: Install GStreamer 1.28.8 development SDK
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          choco install aria2 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'aria2 install failed' }
          refreshenv
          $url='https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-x86_64-1.28.8.exe'
          aria2c.exe --max-connection-per-server=16 --split=16 --min-split-size=1M --file-allocation=none --retry-wait=2 --max-tries=12 --timeout=30 --connect-timeout=20 --out=gstreamer.exe $url
          if ($LASTEXITCODE -ne 0) { throw 'GStreamer installer download failed' }
          $gst='C:\gstreamer\1.0\msvc_x86_64'
          $p=Start-Process -FilePath .\gstreamer.exe -ArgumentList '/TYPE=devel','/VERYSILENT','/NORESTART','/ALLUSERS',"/DIR=$gst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GStreamer installer failed: $($p.ExitCode)" }

      - name: Configure GStreamer environment
        shell: powershell
        run: |
          $gst='C:\gstreamer\1.0\msvc_x86_64'
          if (-not (Test-Path "$gst\bin\gstreamer-1.0-0.dll")) { throw 'GStreamer runtime DLL missing' }
          if (-not (Test-Path "$gst\lib\pkgconfig\gstreamer-1.0.pc")) { throw 'GStreamer development pkg-config missing' }
          "$gst\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH="$gst\bin;$env:PATH"
          $env:PKG_CONFIG_PATH="$gst\lib\pkgconfig"
          & "$gst\bin\pkg-config.exe" --modversion gstreamer-1.0
          if ($LASTEXITCODE -ne 0) { throw 'pkg-config cannot resolve gstreamer-1.0' }
          & "$gst\bin\gst-launch-1.0.exe" --version
      - name: Cargo format check
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo fmt --all
      - name: Cargo tests
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo test --workspace
      - name: Cargo check workspace
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo check --workspace
      - name: Cargo release build
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo build --workspace --release
      - name: Prepare DIST
        shell: powershell
        run: |
          $root='work\MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1'
          $dist="$root\DIST"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $bins=@(
            'melnikov-bridge','melnikov-player','melnikov-playlist','melnikov-visualization',
            'melnikov-video','melnikov-eq','melnikov-lyrics','melnikov-settings',
            'melnikov-cloud','melnikov-cover','melnikov-subscription','melnikov-virtual-dream'
          )
          foreach($b in $bins){ Copy-Item "$root\target\release\$b.exe" "$dist\$b.exe" -Force }
          Copy-Item "$root\target\release\melnikov-launcher.exe" "$dist\MELNIKOV_MUSIC_PLAYER_Classic_V2.exe" -Force
          Copy-Item "$root\README.md" "$dist\README.md" -Force
          Copy-Item "$root\approved_source" "$dist\approved_source" -Recurse -Force
          Get-ChildItem $dist
      - name: Upload Windows RC1
        uses: actions/upload-artifact@v4
        with:
          name: MELNIKOV_MUSIC_PLAYER_Classic_V2_RC1_WINDOWS
          path: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1/DIST
          if-no-files-found: error
