name: MELNIKOV V2 RC1 Windows CI
on:
  push:
    branches: [ci-v2-rc1-20261108]
jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Expand RC1 source
        shell: powershell
        run: |
          Expand-Archive -LiteralPath ci/melnikov_v2_rc1_ci_source.zip -DestinationPath work -Force
          Get-ChildItem work
      - name: Install Rust 1.99.1
        shell: powershell
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.99.1-x86_64-pc-windows-msvc
          rustc -V
          cargo -V
      - name: Install GStreamer Windows SDK for CI
        shell: powershell
        run: |
          $runtime='https://gstreamer.freedesktop.org/pkg/windows/1.26.8/msvc/gstreamer-1.0-msvc-x86_64-1.26.8.msi'
          $devel='https://gstreamer.freedesktop.org/pkg/windows/1.26.8/msvc/gstreamer-1.0-devel-msvc-x86_64-1.26.8.msi'
          curl.exe -L --fail --retry 3 --output gst-runtime.msi $runtime
          if ($LASTEXITCODE -ne 0) { throw 'GStreamer runtime download failed' }
          curl.exe -L --fail --retry 3 --output gst-devel.msi $devel
          if ($LASTEXITCODE -ne 0) { throw 'GStreamer devel download failed' }
          $p=Start-Process msiexec.exe -ArgumentList '/i','gst-runtime.msi','ADDLOCAL=ALL','/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GStreamer runtime install failed: $($p.ExitCode)" }
          $p=Start-Process msiexec.exe -ArgumentList '/i','gst-devel.msi','ADDLOCAL=ALL','/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GStreamer devel install failed: $($p.ExitCode)" }
          $gst=[Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64','Machine')
          if (-not $gst) { $gst=[Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64','User') }
          if (-not $gst) {
            $candidates=@('C:\Program Files\gstreamer\1.0\msvc_x86_64','C:\gstreamer\1.0\msvc_x86_64')
            $gst=$candidates | Where-Object { Test-Path "$_\bin\gstreamer-1.0-0.dll" } | Select-Object -First 1
          }
          if (-not $gst) { throw 'GStreamer root not found after MSI install' }
          "$gst\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH="$gst\bin;$env:PATH"
          $env:PKG_CONFIG_PATH="$gst\lib\pkgconfig"
          & "$gst\bin\pkg-config.exe" --modversion gstreamer-1.0
          if ($LASTEXITCODE -ne 0) { throw 'pkg-config cannot resolve gstreamer-1.0' }
          & "$gst\bin\gst-launch-1.0.exe" --version
      - name: Cargo format check
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo fmt --all
      - name: Cargo tests
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo test --workspace
      - name: Cargo check workspace
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo check --workspace
      - name: Cargo release build
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo build --workspace --release
      - name: Prepare DIST
        shell: powershell
        run: |
          $root='work\MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1'
          $dist="$root\DIST"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $bins=@(
            'melnikov-bridge','melnikov-player','melnikov-playlist','melnikov-visualization',
            'melnikov-video','melnikov-eq','melnikov-lyrics','melnikov-settings',
            'melnikov-cloud','melnikov-cover','melnikov-subscription','melnikov-virtual-dream'
          )
          foreach($b in $bins){ Copy-Item "$root\target\release\$b.exe" "$dist\$b.exe" -Force }
          Copy-Item "$root\target\release\melnikov-launcher.exe" "$dist\MELNIKOV_MUSIC_PLAYER_Classic_V2.exe" -Force
          Copy-Item "$root\README.md" "$dist\README.md" -Force
          Copy-Item "$root\approved_source" "$dist\approved_source" -Recurse -Force
          Get-ChildItem $dist
      - name: Upload Windows RC1
        uses: actions/upload-artifact@v4
        with:
          name: MELNIKOV_MUSIC_PLAYER_Classic_V2_RC1_WINDOWS
          path: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1/DIST
          if-no-files-found: error
