name: MELNIKOV V2 RC1 Windows CI
on:
  push:
    branches: [ci-v2-rc1-20261108]
jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Expand RC1 source
        shell: powershell
        run: |
          Expand-Archive -LiteralPath ci/melnikov_v2_rc1_ci_source.zip -DestinationPath work -Force
          Get-ChildItem work
      - name: Install Rust 1.99.1
        shell: powershell
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.99.1-x86_64-pc-windows-msvc
          rustc -V
          cargo -V
      - name: Install GStreamer 1.28.8 bundle for CI
        shell: powershell
        run: |
          py -m pip install --disable-pip-version-check --no-input "gstreamer_libs==1.28.8" "gstreamer_cli==1.28.8" "gstreamer_plugins==1.28.7"
          if ($LASTEXITCODE -ne 0) { throw 'GStreamer Python components install failed' }
          $pyPrefix=(py -c "import sys; print(sys.prefix)").Trim()
          Write-Host "Python prefix: $pyPrefix"
          $pkg=(Get-ChildItem -Path $pyPrefix -Recurse -Filter pkg-config.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $pkg) { throw 'pkg-config.exe not found in gstreamer-bundle' }
          $bin=Split-Path $pkg -Parent
          $root=Split-Path $bin -Parent
          $pc=(Get-ChildItem -Path $root -Recurse -Filter gstreamer-1.0.pc -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          if (-not $pc) { throw 'gstreamer-1.0.pc not found in gstreamer-bundle' }
          Write-Host "GStreamer root: $root"
          Write-Host "pkg-config: $pkg"
          Write-Host "PKG_CONFIG_PATH: $pc"
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$pc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH="$bin;$env:PATH"
          $env:PKG_CONFIG_PATH=$pc
          & $pkg --modversion gstreamer-1.0
          if ($LASTEXITCODE -ne 0) { throw 'pkg-config cannot resolve gstreamer-1.0' }
          $gst=(Get-ChildItem -Path $root -Recurse -Filter gst-launch-1.0.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $gst) { throw 'gst-launch-1.0.exe not found' }
          & $gst --version
      - name: Cargo format check
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo fmt --all
      - name: Cargo tests
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo test --workspace
      - name: Cargo check workspace
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo check --workspace
      - name: Cargo release build
        working-directory: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1
        run: cargo build --workspace --release
      - name: Prepare DIST
        shell: powershell
        run: |
          $root='work\MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1'
          $dist="$root\DIST"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $bins=@(
            'melnikov-bridge','melnikov-player','melnikov-playlist','melnikov-visualization',
            'melnikov-video','melnikov-eq','melnikov-lyrics','melnikov-settings',
            'melnikov-cloud','melnikov-cover','melnikov-subscription','melnikov-virtual-dream'
          )
          foreach($b in $bins){ Copy-Item "$root\target\release\$b.exe" "$dist\$b.exe" -Force }
          Copy-Item "$root\target\release\melnikov-launcher.exe" "$dist\MELNIKOV_MUSIC_PLAYER_Classic_V2.exe" -Force
          Copy-Item "$root\README.md" "$dist\README.md" -Force
          Copy-Item "$root\approved_source" "$dist\approved_source" -Recurse -Force
          Get-ChildItem $dist
      - name: Upload Windows RC1
        uses: actions/upload-artifact@v4
        with:
          name: MELNIKOV_MUSIC_PLAYER_Classic_V2_RC1_WINDOWS
          path: work/MELNIKOV_MUSIC_PLAYER_Classic_V2_RELEASE_RC1/DIST
          if-no-files-found: error
